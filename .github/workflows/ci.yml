name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for credential patterns
        run: |
          python - <<'EOF'
          import re
          import sys
          from pathlib import Path
          patterns = [
              re.compile(r"-----BEGIN (RSA |EC )?PRIVATE KEY-----"),
              re.compile(r"\b[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}\b"),
              re.compile(r"BINANCE_API_(KEY|SECRET)\s*=\s*['\"][A-Za-z0-9]{32,}['\"]"),
          ]
          hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(p in path.parts for p in (".git", "node_modules", "graphify-out")):
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for pat in patterns:
                  for m in pat.finditer(text):
                      hits.append(f"{path}: {pat.pattern}")
          if hits:
              print("\n".join(hits))
              sys.exit(1)
          print("no credential patterns found")
          EOF
